[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/api/download-zip"
  to = "/indian-culture-wedding-invitations.zip"
  status = 302

[[redirects]]
  from = "/api/download-html"
  to = "/wedding_invitation.html"
  status = 302

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/api/websites"
  to = "/websites/index.json"
  status = 200

[[redirects]]
  from = "/api/settings"
  to = "/settings.json"
  status = 200

[[redirects]]
  from = "/api/rsvp"
  to = "/rsvps.json"
  status = 200

[[redirects]]
  from = "/api/wishes"
  to = "/wishes.json"
  status = 200
