<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="kGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="30%" stop-color="#E5C158" />
      <stop offset="70%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#6F4E02" />
    </linearGradient>
    <linearGradient id="kCopper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D84315" />
      <stop offset="100%" stop-color="#BF360C" />
    </linearGradient>
    <linearGradient id="kLeaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
    <filter id="kGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#AA7C11" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g transform="translate(200, 200)" filter="url(#kGlow)">
    <!-- Aura Ring -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#kGold)" stroke-width="2" stroke-dasharray="6,4"/>
    <circle cx="0" cy="0" r="155" fill="none" stroke="url(#kGold)" stroke-width="1.2" opacity="0.6"/>

    <!-- Mango Leaves (5 leaves) -->
    <!-- Center top -->
    <path d="M 0,-40 Q -15,-100 0,-120 Q 15,-100 0,-40 Z" fill="url(#kLeaf)" stroke="url(#kGold)" stroke-width="1.5"/>
    <line x1="0" y1="-40" x2="0" y2="-115" stroke="url(#kGold)" stroke-width="1"/>
    
    <!-- Top Left -->
    <path d="M -20,-35 Q -65,-75 -70,-95 Q -40,-75 -15,-35 Z" fill="url(#kLeaf)" stroke="url(#kGold)" stroke-width="1.5"/>
    <line x1="-18" y1="-35" x2="-65" y2="-90" stroke="url(#kGold)" stroke-width="1"/>

    <!-- Top Right -->
    <path d="M 20,-35 Q 65,-75 70,-95 Q 40,-75 15,-35 Z" fill="url(#kLeaf)" stroke="url(#kGold)" stroke-width="1.5"/>
    <line x1="18" y1="-35" x2="65" y2="-90" stroke="url(#kGold)" stroke-width="1"/>

    <!-- Far Left -->
    <path d="M -30,-25 Q -90,-45 -105,-50 Q -75,-30 -25,-20 Z" fill="url(#kLeaf)" stroke="url(#kGold)" stroke-width="1.5"/>

    <!-- Far Right -->
    <path d="M 30,-25 Q 90,-45 105,-50 Q 75,-30 25,-20 Z" fill="url(#kLeaf)" stroke="url(#kGold)" stroke-width="1.5"/>

    <!-- Coconut (नारळ) -->
    <ellipse cx="0" cy="-45" rx="36" ry="42" fill="#795548" stroke="url(#kGold)" stroke-width="2.5"/>
    <!-- Coconut fibers -->
    <path d="M -15,-50 Q 0,-30 15,-50" fill="none" stroke="#5D4037" stroke-width="2"/>
    <path d="M -20,-40 Q 0,-20 20,-40" fill="none" stroke="#5D4037" stroke-width="2"/>

    <!-- Kalash Pot Body (तांब्या / कलश) -->
    <!-- Rim / Neck -->
    <ellipse cx="0" cy="-10" rx="42" ry="12" fill="url(#kGold)" stroke="#6F4E02" stroke-width="1.5"/>
    <!-- Pot Belly -->
    <path d="M -40,-8 C -85,25 -70,90 0,95 C 70,90 85,25 40,-8 Z" fill="url(#kCopper)" stroke="url(#kGold)" stroke-width="3"/>

    <!-- Base -->
    <ellipse cx="0" cy="95" rx="35" ry="10" fill="url(#kGold)" stroke="#6F4E02" stroke-width="1.5"/>

    <!-- Swastik Symbol on Kalash Belly -->
    <g transform="translate(0, 42) scale(0.85)" stroke="url(#kGold)" stroke-width="5" stroke-linecap="square" fill="none">
      <!-- Horizontal and vertical center lines -->
      <line x1="-22" y1="0" x2="22" y2="0"/>
      <line x1="0" y1="-22" x2="0" y2="22"/>
      <!-- Arms -->
      <line x1="22" y1="0" x2="22" y2="18"/>
      <line x1="-22" y1="0" x2="-22" y2="-18"/>
      <line x1="0" y1="-22" x2="18" y2="-22"/>
      <line x1="0" y1="22" x2="-18" y2="22"/>
      <!-- Dots in four quadrants -->
      <circle cx="-10" cy="-10" r="2.5" fill="url(#kGold)"/>
      <circle cx="10" cy="-10" r="2.5" fill="url(#kGold)"/>
      <circle cx="-10" cy="10" r="2.5" fill="url(#kGold)"/>
      <circle cx="10" cy="10" r="2.5" fill="url(#kGold)"/>
    </g>

    <!-- Traditional Decorative Garlands (झेंडू / कुंकू काठ) around Pot -->
    <path d="M -38,15 Q 0,35 38,15" fill="none" stroke="url(#kGold)" stroke-width="2.5"/>
    <path d="M -35,68 Q 0,85 35,68" fill="none" stroke="url(#kGold)" stroke-width="2.5"/>
  </g>
</svg>
