<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 200" width="100%" height="100%">
  <defs>
    <linearGradient id="haldiYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="30%" stop-color="#FFEE58" />
      <stop offset="70%" stop-color="#FBC02D" />
      <stop offset="100%" stop-color="#F57F17" />
    </linearGradient>
    <linearGradient id="marigoldOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6F00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
  </defs>

  <!-- Marigold Flower Centerpiece -->
  <g transform="translate(325, 35) scale(0.65)">
    <circle cx="0" cy="0" r="18" fill="url(#haldiYellow)"/>
    <!-- Petals -->
    <circle cx="0" cy="-14" r="7" fill="url(#marigoldOrange)"/>
    <circle cx="12" cy="-7" r="7" fill="url(#marigoldOrange)"/>
    <circle cx="12" cy="7" r="7" fill="url(#marigoldOrange)"/>
    <circle cx="0" cy="14" r="7" fill="url(#marigoldOrange)"/>
    <circle cx="-12" cy="7" r="7" fill="url(#marigoldOrange)"/>
    <circle cx="-12" cy="-7" r="7" fill="url(#marigoldOrange)"/>
    <circle cx="0" cy="0" r="8" fill="#F57F17"/>
  </g>

  <!-- Mango Leaves Left & Right -->
  <path d="M 280,35 Q 220,15 160,35" fill="none" stroke="url(#haldiYellow)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 370,35 Q 430,15 490,35" fill="none" stroke="url(#haldiYellow)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- MAIN CALLIGRAPHY: हळदी समारंभ -->
  <text x="325" y="118" 
        font-family="'Rozha One', 'Yatra One', 'Tiro Devanagari Marathi', serif" 
        font-size="58" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="url(#haldiYellow)" 
        stroke="url(#marigoldOrange)" 
        stroke-width="1.8"
        letter-spacing="4">
    ॥ हळदी समारंभ ॥
  </text>

  <!-- Subtitle: पिवळाधमक रंग व सुवासिनींचा आशीर्वाद -->
  <text x="325" y="158" 
        font-family="'Yatra One', cursive" 
        font-size="18" 
        font-weight="500" 
        text-anchor="middle" 
        fill="#E65100" 
        letter-spacing="4">
    पिवळाधमक रंग • झेंडूची फुले • सुवासिनींचा मंगल आशीर्वाद
  </text>

  <!-- Bottom Swirl -->
  <path d="M 160,180 Q 325,200 490,180" fill="none" stroke="url(#haldiYellow)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="325" cy="190" r="4" fill="url(#marigoldOrange)"/>
</svg>
