<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="100%">
  <defs>
    <linearGradient id="goldLuster" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="25%" stop-color="#FDCB6E" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#8C6D1F" />
    </linearGradient>
    <linearGradient id="maroonShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A51D24" />
      <stop offset="100%" stop-color="#6B0C11" />
    </linearGradient>
    <filter id="royalShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="1" dy="4" stdDeviation="4" flood-color="#4A0E17" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Ornate Decorative Crown / Toran -->
  <g stroke="url(#goldLuster)" stroke-width="2.5" fill="none">
    <path d="M 150,45 Q 250,20 350,42 Q 450,20 550,45" />
    <path d="M 220,38 Q 350,15 480,38" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- Center Kalash & Mango Leaves Motif -->
  <g transform="translate(350, 32) scale(0.7)" filter="url(#royalShadow)">
    <!-- Kalash Pot -->
    <path d="M -15,10 Q -25,25 -18,40 Q 0,48 18,40 Q 25,25 15,10 Z" fill="url(#goldLuster)"/>
    <!-- Coconut -->
    <circle cx="0" cy="5" r="10" fill="#99582A" stroke="url(#goldLuster)" stroke-width="1.5"/>
    <!-- Mango Leaves -->
    <path d="M 0,2 Q -12,-8 -18,-5 Q -10,5 0,8 Z" fill="#2E7D32"/>
    <path d="M 0,2 Q 12,-8 18,-5 Q 10,5 0,8 Z" fill="#2E7D32"/>
    <path d="M 0,2 Q -6,-15 0,-18 Q 6,-15 0,2 Z" fill="#388E3C"/>
  </g>

  <!-- Shehnai Decorative Motif on Left -->
  <g transform="translate(90, 115) rotate(-25) scale(0.65)" filter="url(#royalShadow)">
    <path d="M 0,0 L 70,12 L 72,18 L 0,6 Z" fill="url(#goldLuster)"/>
    <ellipse cx="78" cy="15" rx="8" ry="14" fill="url(#maroonShade)" stroke="url(#goldLuster)" stroke-width="2"/>
    <circle cx="20" cy="4" r="2" fill="#fff"/>
    <circle cx="35" cy="6" r="2" fill="#fff"/>
    <circle cx="50" cy="9" r="2" fill="#fff"/>
  </g>

  <!-- Shehnai Decorative Motif on Right (Mirrored) -->
  <g transform="translate(610, 115) scale(-0.65, 0.65) rotate(-25)" filter="url(#royalShadow)">
    <path d="M 0,0 L 70,12 L 72,18 L 0,6 Z" fill="url(#goldLuster)"/>
    <ellipse cx="78" cy="15" rx="8" ry="14" fill="url(#maroonShade)" stroke="url(#goldLuster)" stroke-width="2"/>
    <circle cx="20" cy="4" r="2" fill="#fff"/>
    <circle cx="35" cy="6" r="2" fill="#fff"/>
    <circle cx="50" cy="9" r="2" fill="#fff"/>
  </g>

  <!-- MAIN CALLIGRAPHY: शुभ विवाह -->
  <g filter="url(#royalShadow)">
    <text x="350" y="145" 
          font-family="'Rozha One', 'Yatra One', 'Tiro Devanagari Marathi', serif" 
          font-size="68" 
          font-weight="900" 
          text-anchor="middle" 
          fill="url(#goldLuster)" 
          stroke="url(#maroonShade)" 
          stroke-width="2"
          letter-spacing="6">
      शुभ विवाह
    </text>
  </g>

  <!-- Traditional Calligraphic Shloka / Subtext -->
  <text x="350" y="190" 
        font-family="'Yatra One', cursive" 
        font-size="20" 
        font-weight="500" 
        text-anchor="middle" 
        fill="#800020" 
        letter-spacing="5">
    ॥ सस्नेह आमंत्रण व कृतज्ञता ॥
  </text>

  <!-- Ornate Floral Tail / Swirl -->
  <path d="M 160,215 C 240,230 300,210 350,225 C 400,210 460,230 540,215" 
        fill="none" stroke="url(#goldLuster)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="350" cy="225" r="5" fill="url(#maroonShade)" stroke="url(#goldLuster)" stroke-width="2"/>
  <circle cx="160" cy="215" r="3.5" fill="url(#goldLuster)"/>
  <circle cx="540" cy="215" r="3.5" fill="url(#goldLuster)"/>
</svg>
