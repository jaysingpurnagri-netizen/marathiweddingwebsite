<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="100%" height="100%">
  <defs>
    <linearGradient id="akshataGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="40%" stop-color="#FFB300" />
      <stop offset="80%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8D6E18" />
    </linearGradient>
    <linearGradient id="kumkumRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C62828" />
      <stop offset="100%" stop-color="#880E4F" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#880E4F" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Mangalashtak Akshata Falling Particles -->
  <g fill="url(#akshataGold)">
    <circle cx="150" cy="30" r="3"/>
    <circle cx="170" cy="45" r="2.5"/>
    <circle cx="190" cy="25" r="3.5"/>
    <circle cx="510" cy="25" r="3.5"/>
    <circle cx="530" cy="45" r="2.5"/>
    <circle cx="550" cy="30" r="3"/>
    <circle cx="350" cy="18" r="4"/>
  </g>

  <!-- Sun / Surya Ray Motif Center -->
  <g transform="translate(350, 42) scale(0.65)">
    <circle cx="0" cy="0" r="14" fill="url(#akshataGold)"/>
    <path d="M 0,-24 L 0,-16 M 0,24 L 0,16 M -24,0 L -16,0 M 24,0 L 16,0 M -17,-17 L -11,-11 M 17,17 L 11,11 M -17,17 L -11,11 M 17,-17 L 11,-11" stroke="url(#akshataGold)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- MAIN CALLIGRAPHY: शुभमंगल सावधान -->
  <g filter="url(#softGlow)">
    <text x="350" y="130" 
          font-family="'Rozha One', 'Yatra One', 'Tiro Devanagari Marathi', serif" 
          font-size="60" 
          font-weight="bold" 
          text-anchor="middle" 
          fill="url(#akshataGold)" 
          stroke="url(#kumkumRed)" 
          stroke-width="1.8"
          letter-spacing="5">
      ॥ शुभमंगल सावधान ॥
    </text>
  </g>

  <!-- Subtitle: गोरज मुहूर्त व मंगलाष्टके -->
  <text x="350" y="170" 
        font-family="'Yatra One', cursive" 
        font-size="19" 
        font-weight="500" 
        text-anchor="middle" 
        fill="#880E4F" 
        letter-spacing="4">
    अक्षतांची उधळण • सप्तपदी • पाणिग्रहण सोहळा
  </text>

  <!-- Bottom Arch Flourish -->
  <path d="M 140,195 Q 350,225 560,195" fill="none" stroke="url(#akshataGold)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="350" cy="210" r="4.5" fill="url(#kumkumRed)" stroke="url(#akshataGold)" stroke-width="1.5"/>
</svg>
