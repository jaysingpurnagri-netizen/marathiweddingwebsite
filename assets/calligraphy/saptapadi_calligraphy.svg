<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 200" width="100%" height="100%">
  <defs>
    <linearGradient id="agniGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFECB3" />
      <stop offset="40%" stop-color="#FFC107" />
      <stop offset="80%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#BF360C" />
    </linearGradient>
    <linearGradient id="agniRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D84315" />
      <stop offset="100%" stop-color="#BF360C" />
    </linearGradient>
  </defs>

  <!-- Sacred Agni / Flame Silhouette -->
  <g transform="translate(325, 38) scale(0.65)">
    <path d="M 0,15 Q 12,0 8,-18 Q 0,-30 0,-40 Q -5,-25 0,-15 Q -12,0 0,15 Z" fill="url(#agniGold)"/>
    <path d="M -6,15 Q -18,2 -10,-12 Q -2,-22 0,-15 Q -4,-5 -6,15 Z" fill="#FF5722"/>
    <path d="M 6,15 Q 18,2 10,-12 Q 2,-22 0,-15 Q 4,-5 6,15 Z" fill="#FF9800"/>
  </g>

  <!-- MAIN CALLIGRAPHY: पवित्र सप्तपदी -->
  <text x="325" y="120" 
        font-family="'Rozha One', 'Yatra One', 'Tiro Devanagari Marathi', serif" 
        font-size="58" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="url(#agniGold)" 
        stroke="url(#agniRed)" 
        stroke-width="1.8"
        letter-spacing="5">
    ॥ पवित्र सप्तपदी ॥
  </text>

  <!-- Subtitle: अग्नीसाक्षीने सात फेरे व आयुष्यभराची साथ -->
  <text x="325" y="160" 
        font-family="'Yatra One', cursive" 
        font-size="18" 
        font-weight="500" 
        text-anchor="middle" 
        fill="#BF360C" 
        letter-spacing="4">
    पवित्र अग्नीच्या साक्षीनं सात पावले • सात सुवर्ण वचने
  </text>

  <!-- Seven Footprints / Lotus dots motif -->
  <g fill="url(#agniGold)" transform="translate(200, 180)">
    <circle cx="20" cy="0" r="3.5"/>
    <circle cx="55" cy="0" r="3.5"/>
    <circle cx="90" cy="0" r="3.5"/>
    <circle cx="125" cy="0" r="4.5" fill="#BF360C"/>
    <circle cx="160" cy="0" r="3.5"/>
    <circle cx="195" cy="0" r="3.5"/>
    <circle cx="230" cy="0" r="3.5"/>
  </g>
</svg>
