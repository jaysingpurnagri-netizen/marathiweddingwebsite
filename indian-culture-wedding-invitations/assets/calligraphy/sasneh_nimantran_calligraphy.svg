<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 200" width="100%" height="100%">
  <defs>
    <linearGradient id="nimantranGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="35%" stop-color="#FDCB6E" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8C6D1F" />
    </linearGradient>
    <linearGradient id="royalMaroon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#800020" />
      <stop offset="100%" stop-color="#4D0013" />
    </linearGradient>
  </defs>

  <!-- Auspicious Kalash Emblem -->
  <g transform="translate(325, 36) scale(0.6)">
    <circle cx="0" cy="0" r="18" fill="url(#nimantranGold)"/>
    <text x="0" y="6" font-family="'Rozha One', serif" font-size="16" font-weight="bold" fill="url(#royalMaroon)" text-anchor="middle">卐</text>
  </g>

  <!-- Ornate Decorative Header Flourish -->
  <path d="M 100,36 Q 220,15 285,36" fill="none" stroke="url(#nimantranGold)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 365,36 Q 430,15 550,36" fill="none" stroke="url(#nimantranGold)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- MAIN CALLIGRAPHY: सस्नेह निमंत्रण -->
  <text x="325" y="118" 
        font-family="'Rozha One', 'Yatra One', 'Tiro Devanagari Marathi', serif" 
        font-size="60" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="url(#nimantranGold)" 
        stroke="url(#royalMaroon)" 
        stroke-width="1.8"
        letter-spacing="5">
    ॥ सस्नेह निमंत्रण ॥
  </text>

  <!-- Subtitle -->
  <text x="325" y="158" 
        font-family="'Yatra One', cursive" 
        font-size="18" 
        font-weight="500" 
        text-anchor="middle" 
        fill="#800020" 
        letter-spacing="4">
    आपली उपस्थिती व शुभाशीर्वाद हेच आमचे खरे भूषण
  </text>

  <!-- Bottom flourish -->
  <path d="M 160,180 Q 325,200 490,180" fill="none" stroke="url(#nimantranGold)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="325" cy="190" r="4" fill="url(#royalMaroon)"/>
</svg>
