<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF73" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#5B3E03" />
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#990024" />
      <stop offset="50%" stop-color="#800020" />
      <stop offset="100%" stop-color="#4D0013" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Traditional Top Arch Flourish -->
  <path d="M 180,35 Q 300,10 420,35" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="300" cy="18" r="4" fill="url(#goldGrad)" />
  <circle cx="280" cy="22" r="2.5" fill="url(#goldGrad)" />
  <circle cx="320" cy="22" r="2.5" fill="url(#goldGrad)" />

  <!-- Lord Ganesha Silhouette Motif in Center -->
  <g transform="translate(300, 52) scale(0.65)" filter="url(#goldGlow)">
    <!-- Tilak / Trishul -->
    <path d="M 0,-25 Q 5,-15 5,-5 Q 15,-10 20,-18 Q 18,-5 8,2 Q 6,15 0,22 Q -6,15 -8,2 Q -18,-5 -20,-18 Q -15,-10 -5,-5 Q -5,-15 0,-25 Z" fill="url(#crimsonGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <circle cx="0" cy="-28" r="3.5" fill="url(#goldGrad)"/>
    <!-- Modak / Trunk curve -->
    <path d="M 0,22 Q 12,32 10,42 Q 6,48 -2,46 Q -8,42 -6,34 Q -4,28 0,22 Z" fill="url(#goldGrad)"/>
    <!-- Crown / Mukut -->
    <path d="M -16,-22 L 0,-40 L 16,-22 Q 0,-28 -16,-22 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Ornate Calligraphy Text: ॥ श्री गणेशाय नमः ॥ -->
  <g id="calligraphyText" filter="url(#goldGlow)">
    <text x="300" y="145" 
          font-family="'Rozha One', 'Yatra One', 'Tiro Devanagari Marathi', 'Noto Serif Devanagari', serif" 
          font-size="44" 
          font-weight="bold" 
          text-anchor="middle" 
          fill="url(#goldGrad)" 
          stroke="#4D0013" 
          stroke-width="1.2"
          letter-spacing="3">
      ॥ श्री गणेशाय नमः ॥
    </text>
  </g>

  <!-- Subtitle Calligraphy: मंगलमूर्ती मोरया -->
  <text x="300" y="180" 
        font-family="'Yatra One', 'Poppins', cursive" 
        font-size="18" 
        font-weight="600" 
        text-anchor="middle" 
        fill="#800020" 
        letter-spacing="4">
    • सर्वकार्येषु सर्वदा निर्विघ्नं कुरु मे देव •
  </text>

  <!-- Bottom Decorative Border Knot -->
  <path d="M 120,198 Q 210,210 300,198 Q 390,210 480,198" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="300" cy="198" r="5" fill="url(#crimsonGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <circle cx="210" cy="204" r="3" fill="url(#goldGrad)"/>
  <circle cx="390" cy="204" r="3" fill="url(#goldGrad)"/>
  <path d="M 100,198 C 115,190 115,206 130,198" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <path d="M 500,198 C 485,190 485,206 470,198" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
</svg>
